name: Daily DB Paper Digest

on:
  schedule:
    # arXiv rebuilds the RSS feed at midnight US Eastern: 04:00 UTC in summer, 05:00 UTC in winter.
    # GitHub starts scheduled runs roughly 2-7 hours late, so runs are spread from well before the
    # rebuild until after it: the first one that executes after the rebuild sends the digest. Runs
    # that see the previous (or an empty) feed find nothing unsent and exit without emailing.
    - cron: '17 0-9/3 * * 1-5'
  workflow_dispatch:
    inputs:
      since:
        description: 'Backfill: email all papers submitted since this UTC time (YYYY-MM-DD or YYYY-MM-DDTHH:MM). Empty = latest RSS batch.'
        required: false

# Runs share the sent-papers state, so never let two overlap.
concurrency:
  group: digest
  cancel-in-progress: false

permissions:
  contents: read
  actions: write  # for the keep-alive call below

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      # state/sent.json (ids already emailed) lives in the Actions cache. Entries are immutable, so
      # each changed state is saved under its content hash and the newest one is restored by prefix.
      - id: restore
        uses: actions/cache/restore@v6
        with:
          path: state
          key: digest-state-${{ github.run_id }}
          restore-keys: digest-state-

      - name: Run digest
        run: |
          printf '%s' "$CONFIG_YAML" > "$RUNNER_TEMP/config.yaml"
          python main.py ${SINCE:+--since "$SINCE"}
        env:
          SINCE: ${{ inputs.since }}
          CONFIG_YAML: ${{ secrets.CONFIG_YAML }}
          DIGEST_CONFIG: ${{ runner.temp }}/config.yaml
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}

      - if: hashFiles('state/sent.json') != '' && steps.restore.outputs.cache-matched-key != format('digest-state-{0}', hashFiles('state/sent.json'))
        uses: actions/cache/save@v6
        with:
          path: state
          key: digest-state-${{ hashFiles('state/sent.json') }}

      # GitHub disables schedules after 60 days without repository activity; re-enabling resets that.
      - name: Keep schedule alive
        if: always()
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/digest.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
