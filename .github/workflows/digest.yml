name: Daily DB Paper Digest

on:
  schedule:
    # arXiv rebuilds its RSS feed at ~00:00 US Eastern — 04:00 UTC in summer,
    # 05:00 UTC in winter. Two post-rebuild attempts cover both seasons and give
    # a same-day backup if one run is delayed or dropped. The watermark (restored
    # from the Actions cache) makes the second run a ~2s no-op once the first has
    # already sent. Odd minutes avoid top-of-the-hour scheduling congestion.
    - cron: '20 4 * * 1-5'   # ~06:20 CEST — summer settle
    - cron: '20 5 * * 1-5'   # ~06:20 CET  — winter settle / backup
  workflow_dispatch:
    inputs:
      since:
        description: 'Fetch papers since this date (YYYY-MM-DD). Leave empty for yesterday.'
        required: false
      date:
        description: 'Fetch papers for a single specific date (YYYY-MM-DD). Leave empty for yesterday.'
        required: false

# Serialize runs so a delayed poll can't overlap and race on the cached state.
concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      # Persist the tiny watermark file (state/seen.json) across runs WITHOUT
      # committing to the repo. Cache entries are immutable, so we save under a
      # unique per-run key and restore the newest previous one via the shared
      # prefix. Weekday runs keep it well inside the 7-day eviction window.
      - name: Restore digest state
        uses: actions/cache@v4
        with:
          path: state
          key: digest-state-${{ github.run_id }}
          restore-keys: |
            digest-state-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write config from secret
        run: printf '%s' "$CONFIG_YAML" > /tmp/config.yaml
        env:
          CONFIG_YAML: ${{ secrets.CONFIG_YAML }}

      - name: Run digest
        run: |
          ARGS=""
          [ -n "$SINCE" ] && ARGS="--since $SINCE"
          [ -n "$DATE" ]  && ARGS="--date $DATE"
          python main.py $ARGS
        env:
          SINCE: ${{ github.event.inputs.since }}
          DATE: ${{ github.event.inputs.date }}
          DIGEST_CONFIG: /tmp/config.yaml
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
